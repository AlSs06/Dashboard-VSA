<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard BIM | Análise de Áreas</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="importmap">
    {
        "imports": {
            "three": "https://esm.sh/three@0.160.0",
            "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/",
            "web-ifc": "https://esm.sh/web-ifc@0.0.57"
        }
    }
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { dark: '#1e1b36', card: '#29254c', accent: '#7b71d9', text: '#e2e8f0' }
                }
            }
        };
    </script>

    <style>
        body { background-color: #1e1b36; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; margin: 0; padding: 0; }
        .dashboard-container { display: grid; grid-template-columns: 350px 1fr; grid-template-rows: 70px 1fr; height: 100vh; padding: 15px; gap: 15px; box-sizing: border-box; }
        .header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #29254c; padding-bottom: 10px; }
        .sidebar { background-color: #1e1b36; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 5px; }
        .card { background-color: #29254c; border-radius: 8px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; box-sizing: border-box; }
        .card h3 { font-size: 0.95rem; color: #ffffff; margin-bottom: 15px; border-bottom: 1px solid #7b71d9; padding-bottom: 5px; }
        .viewer-container { background-color: #29254c; border-radius: 8px; position: relative; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        #viewer-3d { width: 100%; height: 100%; position: absolute; inset: 0; outline: none; }
        #viewer-3d canvas { display: block; width: 100% !important; height: 100% !important; }
        .file-upload { display: flex; gap: 10px; }
        .file-upload label { background-color: #29254c; color: white; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; border: 1px solid #7b71d9; transition: background 0.3s; }
        .file-upload label:hover { background-color: #7b71d9; }
        input[type="file"] { display: none; }
        .kpi-value { font-size: 2.2rem; font-weight: bold; color: #ffffff; text-align: center; padding: 10px 0; }
        #erro-global { display: none; position: fixed; top: 0; left: 0; width: 100%; background-color: #ff4444; color: white; padding: 15px; z-index: 9999; text-align: center; }
        #status-3d { position: absolute; left: 12px; bottom: 12px; z-index: 20; background: rgba(30,27,54,0.88); color: #e2e8f0; border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 7px 10px; font-size: 12px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="erro-global"></div>

    <div class="dashboard-container">
        <header class="header">
            <h1 class="text-3xl font-light">Dashboard | <span class="font-bold">Quadro de Áreas</span></h1>
            <div class="file-upload">
                <label for="upload-ifc" id="lbl-ifc">1. Carregar Modelo 3D (IFC)</label>
                <input type="file" id="upload-ifc" accept=".ifc">
                <label for="upload-json" id="lbl-json">2. Carregar Dados JSON</label>
                <input type="file" id="upload-json" accept=".json">
            </div>
        </header>

        <aside class="sidebar">
            <div class="card">
                <h3>Área Total Mapeada</h3>
                <div class="kpi-value" id="kpi-area">0,00 m²</div>
            </div>
            <div class="card" style="height: 280px;">
                <h3>Tipos de Área (m²)</h3>
                <div style="position: relative; height: 100%; width: 100%;"><canvas id="chartTipos"></canvas></div>
            </div>
            <div class="card" style="flex-grow: 1; min-height: 320px;">
                <h3>Área por Ocupante (m²)</h3>
                <div style="position: relative; height: 100%; width: 100%;"><canvas id="chartOcupantes"></canvas></div>
            </div>
        </aside>

        <main class="viewer-container">
            <div id="viewer-3d"></div>
            <div id="loading-overlay" style="display:none; position:absolute; inset:0; background:rgba(30,27,54,0.85); z-index:10; justify-content:center; align-items:center; flex-direction:column;">
                <div style="width:50px; height:50px; border:4px solid #7b71d9; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite;"></div>
                <p style="margin-top:15px; color:white; font-weight:bold;" id="loading-text">Processando...</p>
            </div>
            <div id="status-3d">Motor 3D: aguardando inicialização...</div>
        </main>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import * as WebIFC from 'web-ifc';

        let chartTiposInstance = null;
        let chartOcupantesInstance = null;
        const colorPalette = ['#7b71d9', '#5a51a8', '#9d94ed', '#423b82', '#b8b2f2', '#342f5c'];

        function setStatus(text) {
            document.getElementById('status-3d').innerText = text;
        }

        function setLoading(show, text = 'Processando...') {
            const overlay = document.getElementById('loading-overlay');
            overlay.style.display = show ? 'flex' : 'none';
            document.getElementById('loading-text').innerText = text;
        }

        function initCharts() {
            Chart.defaults.color = '#e2e8f0';
            const ctxTipos = document.getElementById('chartTipos').getContext('2d');
            chartTiposInstance = new Chart(ctxTipos, {
                type: 'doughnut',
                data: { labels: [], datasets: [{ data: [], backgroundColor: colorPalette, borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, cutout: '65%' }
            });

            const ctxOcupantes = document.getElementById('chartOcupantes').getContext('2d');
            chartOcupantesInstance = new Chart(ctxOcupantes, {
                type: 'bar',
                data: { labels: [], datasets: [{ data: [], backgroundColor: '#7b71d9', borderRadius: 2 }] },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }
        initCharts();

        document.getElementById('upload-json').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const parsed = JSON.parse(event.target.result);
                    const data = Array.isArray(parsed) ? parsed : (parsed.dados || parsed.data || []);
                    let totalArea = 0;
                    const tiposCount = {}, ocupantesArea = {};

                    data.forEach(item => {
                        let val = typeof item.area === 'string' ? parseFloat(item.area.replace(',', '.').replace(/[^0-9.-]+/g, '')) : parseFloat(item.area);
                        if (isNaN(val)) val = 0;
                        totalArea += val;
                        const t = item.tipo_area_urbanizada || 'Não Classificado';
                        tiposCount[t] = (tiposCount[t] || 0) + val;
                        const oc = item.ocupante || 'Sem Ocupante';
                        ocupantesArea[oc] = (ocupantesArea[oc] || 0) + val;
                    });

                    document.getElementById('kpi-area').innerText = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2 }).format(totalArea) + ' m²';
                    chartTiposInstance.data.labels = Object.keys(tiposCount);
                    chartTiposInstance.data.datasets[0].data = Object.values(tiposCount);
                    chartTiposInstance.update();

                    const sorted = Object.entries(ocupantesArea).sort((a, b) => b[1] - a[1]);
                    chartOcupantesInstance.data.labels = sorted.map(x => x[0]);
                    chartOcupantesInstance.data.datasets[0].data = sorted.map(x => x[1]);
                    chartOcupantesInstance.update();

                    document.getElementById('lbl-json').innerText = '✓ JSON Carregado';
                    document.getElementById('lbl-json').style.backgroundColor = '#7b71d9';
                } catch (err) {
                    alert('Erro JSON: ' + err.message);
                }
            };
            reader.readAsText(file, 'windows-1252');
        });

        // MOTOR 3D INDEPENDENTE NATIVO
        const container = document.getElementById('viewer-3d');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#29254c');

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(50, 50, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        const grid = new THREE.GridHelper(100, 50, 0x7b71d9, 0x3d3766);
        scene.add(grid);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // INICIALIZA O MOTOR WEB-IFC
        const ifcAPI = new WebIFC.IfcAPI();
        ifcAPI.SetWasmPath("https://esm.sh/web-ifc@0.0.57/", true);

        async function initEngine() {
            try {
                await ifcAPI.Init();
                setStatus('Motor 3D Nativo: Pronto');
            } catch (e) {
                setStatus('Falha ao inicializar WASM: ' + e.message);
            }
        }
        initEngine();

        let modelGroup = new THREE.Group();
        scene.add(modelGroup);

        document.getElementById('upload-ifc').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            setLoading(true, 'Convertendo geometria IFC...');
            setStatus('Lendo arquivo IFC...');

            try {
                const data = await file.arrayBuffer();
                const buffer = new Uint8Array(data);
                const modelID = ifcAPI.OpenModel(buffer);

                // Limpa modelo anterior
                while(modelGroup.children.length > 0){ 
                    const obj = modelGroup.children[0];
                    obj.geometry.dispose();
                    modelGroup.remove(obj); 
                }

                // Carrega todas as geometrias do IFC diretamente na cena
                ifcAPI.StreamAllMeshes(modelID, (mesh) => {
                    const placedGeom = ifcAPI.GetFlatMesh(modelID, mesh.expressID);
                    const size = placedGeom.geometries.size();
                    for (let i = 0; i < size; i++) {
                        const geomData = placedGeom.geometries.get(i);
                        const geometry = new THREE.BufferGeometry();
                        const pData = ifcAPI.GetGeometry(modelID, geomData.geometryExpressID);
                        
                        const verts = ifcAPI.GetVertexArray(pData.GetVertexData(), pData.GetVertexDataSize());
                        const idx = ifcAPI.GetIndexArray(pData.GetIndexData(), pData.GetIndexDataSize());

                        const pos = new Float32Array(verts.length / 2);
                        for (let k = 0; k < verts.length; k += 6) {
                            pos[k / 2] = verts[k];
                            pos[k / 2 + 1] = verts[k + 1];
                            pos[k / 2 + 2] = verts[k + 2];
                        }

                        geometry.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                        geometry.setIndex(Array.from(idx));
                        geometry.computeVertexNormals();

                        const color = geomData.color;
                        const mat = new THREE.MeshStandardMaterial({
                            color: new THREE.Color(color.x, color.y, color.z),
                            opacity: color.w,
                            transparent: color.w < 1,
                            side: THREE.DoubleSide
                        });

                        const threeMesh = new THREE.Mesh(geometry, mat);
                        const m = geomData.flatTransformation;
                        const mat4 = new THREE.Matrix4().fromArray(m);
                        threeMesh.applyMatrix4(mat4);
                        modelGroup.add(threeMesh);
                    }
                });

                ifcAPI.CloseModel(modelID);

                // Centraliza a câmera no modelo
                const box = new THREE.Box3().setFromObject(modelGroup);
                const center = box.getCenter(new THREE.Vector3());
                const sizeBox = box.getSize(new THREE.Vector3());
                const maxDim = Math.max(sizeBox.x, sizeBox.y, sizeBox.z);

                controls.target.copy(center);
                camera.position.set(center.x + maxDim, center.y + maxDim, center.z + maxDim);
                camera.lookAt(center);
                controls.update();

                document.getElementById('lbl-ifc').innerText = '✓ IFC Carregado';
                document.getElementById('lbl-ifc').style.backgroundColor = '#7b71d9';
                setStatus('Modelo carregado com sucesso!');
            } catch (err) {
                console.error(err);
                alert('Erro ao carregar geometria do IFC: ' + err.message);
                setStatus('Erro no processamento do IFC');
            } finally {
                setLoading(false);
            }
        });
    </script>
</body>
</html>
